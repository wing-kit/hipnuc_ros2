IMU_publisher:
    ros__parameters:
        # HI13S3-USB-000 — stable symlink from udev (startup/install_udev.sh)
        serial_port: "/dev/hipnuc_imu"
        baud_rate: 115200
        frame_id: "imu_link"
        imu_switch: true
        imu_topic: "/IMU_data"
        euler_switch: true
        euler_topic: "/euler_data"
        magnetic_switch: false
        magnetic_topic: "/magnetic_data"


